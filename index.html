<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club de Aventureros Arcángel | Descubre tu clase</title>
<style>
:root{--navy:#123c70;--blue:#1769a6;--gold:#e9bd61;--cream:#fffaf0;--ink:#17385d;--muted:#60758b}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:linear-gradient(145deg,#e5f6ff,#fff8f2 52%,#fbe8f1);font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);min-height:100vh}
.page{max-width:1050px;margin:auto}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:95px 1fr 95px;align-items:center;gap:18px;padding:24px 28px;background:linear-gradient(120deg,#c8edff,#fffdf7 54%,#f9dfe9);border:2px solid white;border-radius:28px;box-shadow:0 12px 30px #16436a15}
.brand-logo{width:100%;max-width:100px;aspect-ratio:1;object-fit:contain;border-radius:18px}
.hero-copy{text-align:center}
.kicker{text-transform:uppercase;letter-spacing:2.5px;font-size:11px;font-weight:900;color:#3b709b;margin:0 0 5px}
h1{font-size:clamp(27px,4.8vw,46px);line-height:1.05;margin:0;color:#103d70}
h1 span{display:block;font-family:Georgia,serif;font-style:italic;color:#1d70a8}
.hero-copy p:last-child{margin:10px 0 0;color:#536d83;line-height:1.5}
.hero-characters{display:flex;align-items:end;justify-content:center;gap:0;height:112px;overflow:hidden}
.hero-characters img{height:115px;width:62px;object-fit:contain;object-position:bottom}
.content{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.panel{background:#ffffffed;border:1px solid white;border-radius:24px;padding:clamp(19px,4vw,34px);box-shadow:0 10px 26px #183f6512}
.panel h2{margin:0 0 8px;font-size:clamp(21px,3vw,27px);color:var(--navy)}
.lead{margin:0 0 20px;color:var(--muted);line-height:1.6}
.form-row{display:flex;gap:10px;align-items:stretch;margin-bottom:12px;}
input{flex:1;min-width:0;padding:15px 16px;border:2px solid #d6e6f1;border-radius:14px;background:#fbfdff;font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:#4194c9;box-shadow:0 0 0 4px #4194c91c}
button{border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.05);transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#103d70,#1675b5);color:white;box-shadow:0 4px 0 #0c2f56}
.message{min-height:20px;color:#a32e4e;font-size:14px;margin:10px 0 0}
footer{text-align:center;padding:23px 8px;color:#688097;font-size:13px}
.arcangel-header{display:flex;align-items:center;justify-content:center;gap:22px;padding:26px 24px;border-radius:28px;background:linear-gradient(115deg,#d9f3ff 0%,#fffdf8 53%,#ffe5ef 100%);border:4px solid #fff;box-shadow:0 12px 30px rgba(39,91,130,.12);}
.arcangel-header .brand-logo{display:block;width:clamp(100px,20vw,165px);height:auto;object-fit:contain;border-radius:16px;background:#fff;padding:6px;box-shadow:0 7px 18px rgba(28,70,110,.12);}
.arcangel-header .hero-copy{text-align:center;min-width:0;}
.arcangel-header .kicker{margin:0 0 7px;font-size:clamp(10px,1.6vw,14px);letter-spacing:2px;font-weight:800;color:#426f94;}
.arcangel-header h1{margin:0;color:#163f6d;font-size:clamp(27px,4.3vw,46px);line-height:1.05;font-weight:850;}
.arcangel-header h1 span{color:#287cac;font-family:Georgia,serif;font-style:italic;}
.arcangel-header .hero-copy p:last-child{margin:12px 0 0;color:#587083;font-size:clamp(13px,1.9vw,18px);line-height:1.45;}
@media(max-width:600px){.arcangel-header{flex-direction:column;gap:12px;padding:20px 14px}.arcangel-header .brand-logo{width:125px}.arcangel-header .kicker{letter-spacing:1.2px}}
</style>
</head>
